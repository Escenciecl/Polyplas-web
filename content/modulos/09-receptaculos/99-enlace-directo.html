<script>
/* Enlace directo desde las fichas de producto: /categoria-producto/receptaculos/#receptaculo=90x90_cuad abre ese modelo */
(function () {
  var m = /(?:^#|&)receptaculo=([a-z0-9_-]+)/i.exec(window.location.hash);
  if (!m) return;
  var intentos = 0;
  (function abrir() {
    if (typeof window.openReceptDetail === 'function') { window.openReceptDetail(m[1]); return; }
    if (++intentos < 50) setTimeout(abrir, 200);
  })();
})();
</script>
