<script>
/* Enlace directo desde las fichas de producto: /categoria-producto/receptaculos/#receptaculo=90x90_cuad abre la compra de ese modelo
   (igual que el botón COMPRAR del listado). Si no hay stock, abre el detalle. */
(function () {
  var m = /(?:^#|&)receptaculo=([a-z0-9_-]+)/i.exec(window.location.hash);
  if (!m) return;
  var id = m[1], intentos = 0;
  function boton() {
    var bs = [].slice.call(document.querySelectorAll('button[class*="btn-buy"]')).filter(function (x) {
      var oc = x.getAttribute('onclick') || '';
      return oc.indexOf("'" + id + "'") >= 0 || x.id === 'buy-' + id || (id === 'kuyen' && oc.indexOf('openKuyenUpsell') >= 0);
    });
    return bs.filter(function (x) { return x.offsetParent; })[0] || bs[0];
  }
  (function abrir() {
    if (window.__ppDeepLink) return;
    if (typeof window.openReceptDetail === 'function') {
      window.__ppDeepLink = true;
      history.replaceState(null, '', window.location.pathname + window.location.search);
      setTimeout(function () { var b = boton(); if (b && !b.disabled) b.click(); else window.openReceptDetail(id); }, 300);
      return;
    }
    if (++intentos < 50) setTimeout(abrir, 200);
  })();
})();
</script>
