<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

  .poly-ui-container {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 0;
    font-family: 'Inter', sans-serif;
  }

  .poly-glass-card {
    width: 100%;
    background: radial-gradient(circle at 0% 0%, #004a99 0%, #002d5c 100%);
    padding: 60px 50px;
    border-radius: 24px;
    box-shadow: 0 25px 50px -12px rgba(0, 45, 92, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-sizing: border-box;
    min-height: 400px;
    transition: all 0.5s ease;
  }

  .poly-ui-header {
    text-align: center;
    margin-bottom: 45px;
  }

  .poly-ui-header h2 {
    color: #ffffff;
    font-size: clamp(26px, 4vw, 38px);
    font-weight: 800;
    margin: 0 0 15px 0;
    letter-spacing: -1px;
  }

  .poly-ui-header p {
    color: rgba(255, 255, 255, 0.7);
    font-size: 16px;
    line-height: 1.6;
    max-width: 500px;
    margin: 0 auto;
  }

  .poly-ui-header strong {
    color: #25d366;
  }

  .poly-ui-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .poly-ui-field {
    margin-bottom: 20px;
    text-align: left;
  }

  .poly-ui-field label {
    display: block;
    color: rgba(255, 255, 255, 0.9);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .input-wrapper input,
  .input-wrapper textarea {
    width: 100%;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #ffffff;
    font-size: 16px;
    transition: all 0.3s ease;
    box-sizing: border-box;
  }

  .input-wrapper input:focus,
  .input-wrapper textarea:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.1);
    border-color: #25d366;
    box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.1);
  }

  .poly-ui-btn {
    width: 100%;
    background: #25d366;
    color: #002d5c;
    border: none;
    padding: 22px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.4s ease;
    margin-top: 10px;
  }

  .poly-ui-btn:hover {
    background: #ffffff;
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
  }

  .poly-ui-footer p {
    color: rgba(255, 255, 255, 0.4);
    font-size: 13px;
    margin-top: 30px;
    text-align: center;
  }

  .success-icon {
    animation: scaleIn 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
  }

  @keyframes scaleIn {
    from {
      transform: scale(0);
      opacity: 0;
    }
    to {
      transform: scale(1);
      opacity: 1;
    }
  }

  @media (max-width: 600px) {
    .poly-ui-row {
      grid-template-columns: 1fr;
    }
    .poly-glass-card {
      padding: 40px 25px;
      border-radius: 0;
    }
  }
</style>
<script>
  var SB_URL = 'https://gdrkscedvkjtcvexnhzg.supabase.co';
  var SB_KEY = 'sb_publishable_qT9WuJK5Wi6VghgMvcYIMw_IGBtn1Tc';
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbw4WkE3slUjbDIUrbYVZD-aL1nB6WWJeyj6XG6rpFNz9p3pSFfdmUd3FjY_hV-QQJNkKA/exec';

  function genUUID() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0,
        v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function saveToSheet(convId, data) {
    var shortId = 'PP-' + convId.split('-').pop().substring(0, 5).toUpperCase();
    // Paso 1: insertar fila nueva                                                                                                   
    fetch(SHEET_URL + '?' + new URLSearchParams({
      accion: 'nuevo_lead',
      idRef: shortId,
      producto: window.location.href,
      gclid: 'Formulario web'
    }).toString(), {
      mode: 'no-cors'
    });
    // Paso 2: rellenar nombre, email y teléfono (espera 2s a que la fila exista)
    setTimeout(function() {
      fetch(SHEET_URL + '?' + new URLSearchParams({
        accion: 'form_datos',
        idRef: shortId,
        nombre: data.name,
        email: data.email,
        telefono: data.whatsapp
      }).toString(), {
        mode: 'no-cors'
      });
    }, 2000);
  }

  function saveToSupabase(data) {
    var convId = genUUID();
    var now = new Date().toISOString();
    fetch(SB_URL + '/rest/v1/conversations', {
      method: 'POST',
      headers: {
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({
        id: convId,
        client_name: data.name,
        client_email: data.email,
        unread_count: 1,
        last_message_at: now,
        metadata: {
          phone: data.whatsapp,
          phone_type: 'mobile',
          query: data.message,
          intent: 'cotizacion',
          source: 'form',
          productoUrl: window.location.href
        }
      })
    }).then(function(res) {
      if (!res.ok) return;
      fetch(SB_URL + '/rest/v1/messages', {
        method: 'POST',
        headers: {
          'apikey': SB_KEY,
          'Authorization': 'Bearer ' + SB_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          conversation_id: convId,
          sender: 'client',
          content: data.message,
          created_at: now
        })
      });
      saveToSheet(convId, data);
    }).catch(function(e) {
      console.warn('Supabase error:', e);
    });
  }

  const form = document.getElementById('polyForm');
  const formContent = document.getElementById('formContent');
  const successMessage = document.getElementById('successMessage');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(form);
    const object = Object.fromEntries(formData);
    const json = JSON.stringify(object);

    form.querySelector('button').innerHTML = "Enviando...";

    fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: json
      })
      .then(async (response) => {
        if (response.status == 200) {
          saveToSupabase(object);
          formContent.style.display = "none";
          successMessage.style.display = "block";
        } else {
          alert("Algo salió mal. Por favor intenta de nuevo.");
          form.querySelector('button').innerHTML = "Consultar";
        }
      })
      .catch(error => {
        console.log(error);
        alert("Error de conexión.");
        form.querySelector('button').innerHTML = "Consultar";
      });
  });
</script>
